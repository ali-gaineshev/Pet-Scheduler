<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous">

    <title>Log in Page</title>
</head>

<body>
    <div class="container-fluid d-flex justify-content-center mt-5">
        <div class="row">
            <div class="col-md-12">
                <h3>
                    Login In
                </h3>

                <form role="form" id="loginForm" method="post">
                    <div class="form-group">
                        <label for="inputEmail">Email address</label>
                        <input type="text" name="email" class="form-control" id="inputEmail" required />
                    </div>
                    <div class="form-group">
                        <label for="inputPassword">Password</label>
                        <input type="password" name="password" class="form-control" id="inputPassword" required />
                    </div>
                    <div class="checkbox">
                        <label><input type="checkbox" /> Remember Me</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>

                <br>
                <label id="errorMessage" for="error" style="color: red; margin-top: 10px;">error_placeholder</label>
                <hr class="my-4">
                <label class="mr-3" for="signUp">Don't have an account? <a id="signUp" href="/signup">Sign Up</a></label>

                <!-- New Section -->
                <form id="testForm" role="form">
                    <div class="d-flex justify-content-between">
                        <label class="mr-3" for="testButton">Want to test the application?</label>
                        <button type="submit" name="test_button" id="testButton" class="btn btn-link">Test</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
